<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本页内模拟人工批量下载视频</title>
    <style>
        /* 统一重置样式（合并重复的 * 选择器） */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        /* 左上角首页按钮样式（优化层级，绝对不被遮挡） */
        .home-btn {
            position: fixed; /* 固定定位，脱离文档流 */
            top: 10px;
            left: 10px;
            padding: 8px 16px;
            background: rgba(76, 0, 130, 0.9); /* 提高不透明度，更醒目 */
            color: #fff;
            font-size: 14px;
            text-decoration: none;
            border-radius: 6px;
            transition: background 0.3s, transform 0.3s;
            z-index: 99999; /* 最大化层级，碾压所有元素 */
            pointer-events: auto; /* 强制允许点击 */
            box-shadow: 0 3px 10px rgba(0,0,0,0.3); /* 增加阴影，视觉上突出 */
        }
        .home-btn:hover {
            background: rgba(76, 0, 130, 1);
            transform: scale(1.05);
        }
        body {
            padding: 20px;
            background: #f5f7fa;
            padding-top: 60px; /* 给顶部按钮留空间，避免内容遮挡按钮 */
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
            position: relative;
            z-index: 1; /* 确保容器层级低于按钮 */
        }
        h1 {
            font-size: 22px;
            text-align: center;
            color: #2d3748;
            margin-bottom: 25px;
        }
        .config-area {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .input-group {
            flex: 1;
            min-width: 200px;
        }
        label {
            display: block;
            font-size: 14px;
            color: #4a5568;
            margin-bottom: 8px;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
        }
        input:focus {
            outline: none;
            border-color: #4299e1;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.1);
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        #generateBtn {
            background: #4299e1;
            color: #fff;
        }
        #generateBtn:hover {
            background: #3182ce;
        }
        #batchDownloadBtn {
            background: #48bb78;
            color: #fff;
        }
        #batchDownloadBtn:hover {
            background: #38a169;
        }
        #clearBtn {
            background: #e53e3e;
            color: #fff;
        }
        #clearBtn:hover {
            background: #c53030;
        }
        .video-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
            max-height: 70vh;
            overflow-y: auto;
            padding-right: 5px;
        }
        .video-item {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
        }
        .video-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .video-header h3 {
            font-size: 16px;
            color: #2d3748;
        }
        .single-download-btn {
            background: #4299e1;
            color: #fff;
            padding: 6px 12px;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
        }
        .single-download-btn:hover {
            background: #3182ce;
        }
        .link-text {
            font-size: 13px;
            color: #718096;
            margin-bottom: 10px;
            word-break: break-all;
        }
        video {
            width: 100%;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        .tip {
            font-size: 12px;
            color: #9f7aea;
        }
        .download-tip {
            font-size: 12px;
            color: #e53e3e;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <!-- 首页按钮移到 body 下、container 外，确保DOM正确渲染 -->
    <a href="https://lihaoyu0618.github.io/lihaoyu0618/page2.html" class="home-btn">首页</a>

    <div class="container">
        <h1>本页内操作 → 输入个数生成视频 → 模拟人工下载</h1>
        <div class="config-area">
            <div class="input-group">
                <label for="baseLink">基础链接</label>
                <input type="text" id="baseLink" value="https://api.mmp.cc/api/ksvideo?type=mp4&id=" placeholder="固定基础链接">
            </div>
            <div class="input-group">
                <label for="videoCount">下载视频个数</label>
                <input type="number" id="videoCount" min="1" placeholder="例如：5" value="3">
            </div>
        </div>
        <div class="btn-group">
            <button id="generateBtn">生成视频</button>
            <button id="batchDownloadBtn">批量自动下载（本页内触发）</button>
            <button id="clearBtn">清空</button>
        </div>
        <div class="video-container" id="videoContainer"></div>
    </div>

    <script>
        // DOM元素
        const baseLinkInput = document.getElementById('baseLink');
        const videoCountInput = document.getElementById('videoCount');
        const generateBtn = document.getElementById('generateBtn');
        const batchDownloadBtn = document.getElementById('batchDownloadBtn');
        const clearBtn = document.getElementById('clearBtn');
        const videoContainer = document.getElementById('videoContainer');
        // 内置ID池（可自行扩展）
        const ID_POOL = [
            'jk', 'YuMeng', 'NvDa', 'NvGao', 'ReWu',
            'QingCun', 'YuZu', 'SheJie', 'ChuanDa',
            'HanFu', 'HeiSi', 'BianZhuang', 'LuoLi', 'TianMei'
        ];
        // 存储生成的视频列表（本页内维护）
        let videoList = [];
        // 关键修改：支持无限数量，重复随机选取ID（超过14个时循环随机）
        function getRandomIds(count) {
            const randomIds = [];
            for (let i = 0; i < count; i++) {
                // 随机从ID池选取一个，可重复
                const randomIndex = Math.floor(Math.random() * ID_POOL.length);
                randomIds.push(ID_POOL[randomIndex]);
            }
            return randomIds;
        }
        // 生成视频项：直接嵌入本页，不跳转
        function generateVideoItems() {
            const baseLink = baseLinkInput.value.trim();
            const count = parseInt(videoCountInput.value);
            // 校验参数
            if (!baseLink) {
                alert('请填写基础链接！');
                return;
            }
            if (isNaN(count) || count < 1) {
                alert('请填写有效的下载个数！');
                return;
            }
            // 清空旧数据（本页内重置）
            videoContainer.innerHTML = '';
            videoList = [];
            const selectedIds = getRandomIds(count); // 调用修改后的随机ID函数
            selectedIds.forEach((id, index) => {
                const fullLink = baseLink + id;
                videoList.push({ id, link: fullLink });
                // 创建视频DOM，嵌入当前页面
                const videoItem = document.createElement('div');
                videoItem.className = 'video-item';
                videoItem.innerHTML = `
                    <div class="video-header">
                        <h3>视频 ${index + 1} (ID: ${id})</h3>
                        <span class="single-download-btn" onclick="downloadSingle('${fullLink}', 'video_${id}')">本页下载</span>
                    </div>
                    <div class="link-text">视频链接：${fullLink}</div>
                    <video controls playsinline src="${fullLink}"></video>
                    <div class="tip">提示：无法播放 = 链接无效</div>
                    <div class="download-tip">下载说明：点击按钮后等待浏览器弹窗，手动确认保存</div>
                `;
                videoContainer.appendChild(videoItem);
            });
            alert(`已在本页生成 ${count} 个视频，可点击单个下载或批量下载！`);
        }
        // 核心：本页内模拟人工下载（无跳转）
        function downloadSingle(videoLink, fileName) {
            // 创建临时a标签，仅在本页内操作，不跳转新标签
            const a = document.createElement('a');
            a.href = videoLink;
            a.download = fileName || `video_${Date.now()}`; // 指定下载文件名
            a.style.display = 'none'; // 隐藏标签，不影响页面布局
            document.body.appendChild(a);
            
            // 模拟人工点击下载按钮
            a.click();
            
            // 移除临时标签，清理DOM
            document.body.removeChild(a);
        }
        // 批量自动下载：本页内依次触发，带延迟防拦截
        function batchAutoDownload() {
            if (videoList.length === 0) {
                alert('请先生成视频！');
                return;
            }
            alert(`即将在本页内批量下载 ${videoList.length} 个视频，\n请依次在浏览器弹窗中确认保存！`);
            
            // 逐个触发下载，间隔1.5秒，避免浏览器拦截
            videoList.forEach((video, index) => {
                setTimeout(() => {
                    downloadSingle(video.link, `video_${video.id}_${Date.now()}`);
                }, index * 1500);
            });
        }
        // 清空本页所有视频和数据
        function clearAll() {
            videoContainer.innerHTML = '';
            videoList = [];
            alert('已清空本页所有视频！');
        }
        // 绑定事件（全部在本页内执行）
        generateBtn.addEventListener('click', generateVideoItems);
        batchDownloadBtn.addEventListener('click', batchAutoDownload);
        clearBtn.addEventListener('click', clearAll);
        // 暴露函数到全局，供页面内按钮调用
        window.downloadSingle = downloadSingle;
    </script>
</body>
</html>
