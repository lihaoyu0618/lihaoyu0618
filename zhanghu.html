        .card-header {

            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
           
        .card-icon {

        }
           
        .info-item {

        .info-label {
            font-size: 0.9rem;

        }
           
        .info-value {
            font-size: 1.2rem;
            word-break: break-all;
            display: flex;
            align-items: center;
        }
           
        .password-container {
            display: flex;
            align-items: center;
        }
           
        .copy-btn {

            border: none;

            display: flex;

            border-radius: 8px;
            margin-top: 10px;
            transition: all 0.3s ease;
            font-weight: 500;
        }
           
        .website-link:hover {
            background: #5d4ae0;
            transform: translateY(-2px);
        }
           
        .notification {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            padding: 12px 25px;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transition: opacity 0.3s;
        }
           
        .notification.show {
            opacity: 1;
        }
           
        /* 移动端样式 */

            display: none; /* 初始隐藏 */

            }
        }

            text-align: center;
            margin-top: 30px;
            opacity: 0.7;

   <script>
       // 检测设备类型并显示相应布局
       function detectDeviceType() {
           if (window.innerWidth <= 768) {
               document.querySelector('.desktop-layout').style.display = 'none';
               document.querySelector('.mobile-layout').style.display = 'block';
           } else {
               document.querySelector('.desktop-layout').style.display = 'flex';
               document.querySelector('.mobile-layout').style.display = 'none';
           }
       }
       
       // 初始检测
       window.addEventListener('load', detectDeviceType);
       
       // 窗口大小改变时重新检测
       window.addEventListener('resize', detectDeviceType);
       
       // 复制密码功能
       function copyPassword() {
           const passwordElement = document.getElementById('password') || document.getElementById('password-mobile');
           const password = passwordElement ? passwordElement.innerText : '';
           
           if (!password) {
               console.error('未找到密码元素。');
               return;
           }
           
           navigator.clipboard.writeText(password).then(() => {
               // 显示通知
               const notification = document.getElementById('notification');
               notification.classList.add('show');
               // 2秒后隐藏通知
               setTimeout(() => {
                   notification.classList.remove('show');
               }, 2000);
           }).catch(err => {
               console.error('复制失败: ', err);
               alert('复制失败，请手动复制密码。');
           });
       }
   </script>
